services:
  postgres:
    image: postgres:16-alpine
    container_name: sugarcane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sugarcane
      POSTGRES_USER: sugarcane
      POSTGRES_PASSWORD: sugarcane
    ports:
      - "5432:5432"
    volumes:
      - sugarcane_postgres:/var/lib/postgresql/data
      - ./database/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugarcane -d sugarcane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sugarcane_postgres:

