name: Trangkil Production CI/CD

on:
  push:
    branches:
      - production

permissions:
  contents: read

concurrency:
  group: trangkil-production
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, build, and desktop package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout production commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        shell: powershell
        run: npm.cmd ci --no-audit --no-fund
      - name: Typecheck
        shell: powershell
        run: npm.cmd run typecheck
      - name: Build API and web
        shell: powershell
        run: ./scripts/build-public.ps1
      - name: Build desktop installer
        shell: powershell
        run: npm.cmd run package -w @sugarcane/desktop
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: tebuai-trangkil-desktop
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Trangkil Windows server
    needs: verify
    runs-on: [self-hosted, Windows, X64, trangkil-production]
    timeout-minutes: 55
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy with local backup and rollback
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\cicd\deploy-trangkil.ps1" `
            -ProductionPath 'C:\Users\Axioo Pongo\Documents\XOORA\AI-Grading-Sugarcane' `
            -ExpectedSha $env:GITHUB_SHA
