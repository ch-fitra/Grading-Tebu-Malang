worker_processes 1;
error_log logs/error.log warn;
pid logs/nginx.pid;
events { worker_connections 512; }
http {
    server_names_hash_bucket_size 64;
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    access_log off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $origin_proto { default $scheme; https https; }
    server {
        listen 127.0.0.1:8081 default_server;
        server_name pgmalang.aisugarcanembs.com localhost;
        # Replaced by scripts/configure-malang-gateway.mjs for the current project folder.
        root "__WEB_ROOT__";
        index index.html;
        client_max_body_size 200m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
        location /api/ {
            proxy_pass http://127.0.0.1:4111;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $origin_proto;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
        location /storage/ {
            proxy_pass http://127.0.0.1:4111;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $origin_proto;
        }
        location = /ws {
            proxy_pass http://127.0.0.1:4111;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }
        location = /health { proxy_pass http://127.0.0.1:4111; }
    }
}
